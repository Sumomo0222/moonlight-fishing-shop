<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>月光钓鱼小铺 · Moonlight Fishing Shop</title>
<meta name="description" content="在月光下的小钓鱼铺抛竿、等待浮漂晃动、收线，钓起湖里奇妙的宝贝，收获一张分享卡片。">
<meta name="theme-color" content="#0b1026">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='27' fill='%23ffe9b3'/><circle cx='45' cy='26' r='23' fill='%230b1026'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="scene" id="scene">

  <!-- 背景：星空 / 月亮 / 云 -->
  <div class="sky">
    <div class="stars" id="stars"></div>
    <div class="shooting" id="shooting"></div>
    <div class="moon-glow"></div>
    <div class="moon"></div>
    <div class="cloud cloud-a"></div>
    <div class="cloud cloud-b"></div>
  </div>

  <!-- 背景：远山与小塔剪影 -->
  <svg class="mountains far" viewBox="0 0 1440 220" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 210 L0 130 Q140 60 300 118 Q380 142 470 108 Q560 74 700 116 Q820 150 940 110 Q1080 66 1200 112 Q1320 150 1440 118 L1440 210 Z" fill="#1a2347"/>
    <g transform="translate(1046 62)" fill="#1a2347">
      <rect x="10" y="34" width="16" height="22"/>
      <path d="M4 36q14-10 28 0l-4 3q-10-6-20 0z"/>
      <path d="M8 24q10-8 20 0l-3 2.6q-7-4.6-14 0z"/>
      <path d="M12 15q6-5 12 0l-2 2q-4-2.6-8 0z"/>
      <rect x="16" y="8" width="4" height="8"/>
      <circle cx="18" cy="6" r="1.6"/>
    </g>
  </svg>
  <svg class="mountains near" viewBox="0 0 1440 200" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 200 L0 168 Q180 120 340 158 Q470 188 600 160 Q760 124 900 158 Q1060 190 1200 162 Q1330 138 1440 164 L1440 200 Z" fill="#10182f"/>
  </svg>

  <!-- 中景：湖面 -->
  <div class="water">
    <div class="moon-road" id="moonRoad"><span class="road-base"></span></div>
    <svg class="waves back" viewBox="0 0 2880 60" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 30 Q90 16 180 30 T360 30 T540 30 T720 30 T900 30 T1080 30 T1260 30 T1440 30 T1620 30 T1800 30 T1980 30 T2160 30 T2340 30 T2520 30 T2700 30 T2880 30 V60 H0 Z" fill="rgba(9,14,34,.6)"/>
    </svg>
    <svg class="boat" viewBox="0 0 120 60" aria-hidden="true">
      <g class="bobg">
        <line x1="60" y1="38" x2="60" y2="10" stroke="#0d1430" stroke-width="3"/>
        <path d="M60 12 L82 22 L60 28 Z" fill="#182247"/>
        <path d="M8 38 Q60 50 112 38 L98 52 Q60 60 22 52 Z" fill="#0d1430"/>
        <path d="M8 38 Q60 50 112 38" stroke="rgba(255,236,170,.22)" stroke-width="1.5" fill="none"/>
        <circle cx="86" cy="34" r="9" fill="#ffb46a" opacity=".22"/>
        <circle cx="86" cy="34" r="4" fill="#ffb46a" opacity=".9"/>
      </g>
    </svg>
    <svg class="waves front" viewBox="0 0 2880 60" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 30 Q90 14 180 30 T360 30 T540 30 T720 30 T900 30 T1080 30 T1260 30 T1440 30 T1620 30 T1800 30 T1980 30 T2160 30 T2340 30 T2520 30 T2700 30 T2880 30 V60 H0 Z" fill="rgba(148,180,240,.13)"/>
    </svg>
    <div class="mist"></div>
  </div>

  <!-- 鱼线 -->
  <svg class="line-layer" aria-hidden="true"><path id="linePath" d=""/></svg>

  <!-- 浮漂 -->
  <div class="bobber" id="bobber" aria-hidden="true">
    <div class="bobber-inner">
      <span class="stick"></span>
      <span class="ball"></span>
    </div>
  </div>

  <!-- 收获物跃出 -->
  <div class="catch-jump" id="catchJump" aria-hidden="true"></div>

  <!-- 水花 / 波纹 / 星屑特效层 -->
  <div class="fx" id="fx" aria-hidden="true"></div>

  <!-- 前景：木栈桥 -->
  <div class="pier">
    <div class="post p1"></div>
    <div class="post p2"></div>
    <div class="deck"></div>
    <svg class="cat" viewBox="0 0 90 70" aria-hidden="true">
      <path d="M64 18l3-9 6 7z" fill="#0b0f22"/>
      <path d="M52 16l-2-9 7 5z" fill="#0b0f22"/>
      <circle cx="60" cy="24" r="11" fill="#0b0f22"/>
      <path d="M30 62c-4-16 4-26 17-26 12 0 19 8 18 17-.5 4-2 7-4 9z" fill="#0b0f22"/>
      <path d="M32 58q-14 0-13-14 1-8 8-9" fill="none" stroke="#0b0f22" stroke-width="6" stroke-linecap="round"/>
      <path d="M55 15q9 1 11 10" fill="none" stroke="rgba(255,233,170,.4)" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M47 36q2 2 4 0M57 36q2 2 4 0" fill="none" stroke="#ffd98a" stroke-width="1.3" stroke-linecap="round" opacity=".85"/>
      <path d="M60 42q1 1.2 2 0" stroke="#ffd98a" stroke-width="1" opacity=".6" fill="none"/>
      <path d="M49 30h-6M49 33l-6 1" stroke="rgba(255,240,210,.3)" stroke-width="1"/>
    </svg>
    <div class="bucket"></div>
  </div>

  <!-- 前景：小铺 -->
  <div class="shop">
    <svg viewBox="0 0 260 240" aria-hidden="true">
      <defs>
        <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
        <linearGradient id="roofG" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#241a44"/><stop offset=".62" stop-color="#332459"/><stop offset="1" stop-color="#3d2c66"/>
        </linearGradient>
      </defs>
      <ellipse cx="130" cy="233" rx="98" ry="7" fill="rgba(3,5,14,.45)"/>
      <rect x="50" y="196" width="10" height="34" fill="#33200f"/>
      <rect x="200" y="196" width="10" height="34" fill="#33200f"/>
      <rect x="38" y="92" width="184" height="106" fill="#5e3c22"/>
      <path d="M38 112h184M38 132h184M38 152h184M38 172h184" stroke="#4a2e18" stroke-width="1.4" opacity=".7"/>
      <path d="M26 92 Q130 20 234 92 Z" fill="url(#roofG)"/>
      <path d="M6 96 Q130 16 254 96 L254 101 Q130 26 6 101 Z" fill="#241a44"/>
      <path d="M168 31 Q218 54 245 89" stroke="rgba(255,233,170,.5)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M98 33 Q130 22 162 33 L158 40 Q130 30 102 40 Z" fill="#1c1338"/>
      <line x1="70" y1="97" x2="70" y2="108" stroke="#2b1a0d" stroke-width="2"/>
      <line x1="190" y1="97" x2="190" y2="108" stroke="#2b1a0d" stroke-width="2"/>
      <rect x="56" y="108" width="28" height="21" rx="3" fill="#3a2414" stroke="#c98f3d" stroke-width="1"/>
      <rect x="176" y="108" width="28" height="21" rx="3" fill="#3a2414" stroke="#c98f3d" stroke-width="1"/>
      <text x="70" y="124" text-anchor="middle" font-size="13" fill="#ffd98a" font-family="'Noto Serif SC','Songti SC',serif">钓</text>
      <text x="190" y="124" text-anchor="middle" font-size="13" fill="#ffd98a" font-family="'Noto Serif SC','Songti SC',serif">月</text>
      <circle cx="96" cy="142" r="30" fill="#ffcf7e" opacity=".45" filter="url(#soft)"/>
      <rect x="72" y="114" width="48" height="54" rx="4" fill="#241505"/>
      <rect x="76" y="118" width="40" height="46" rx="3" fill="#ffce7d"/>
      <path d="M96 118v46M76 141h40" stroke="#241505" stroke-width="3"/>
      <path d="M80 156q4-6 8 0t8 0" stroke="rgba(120,60,10,.5)" stroke-width="2" fill="none"/>
      <rect x="152" y="118" width="46" height="80" rx="3" fill="#33200f" stroke="#241505" stroke-width="2"/>
      <path d="M162 118v80M172 118v80M182 118v80M192 118v80" stroke="#241505" stroke-width="1.6" opacity=".8"/>
      <circle cx="191" cy="160" r="2.6" fill="#c98f3d"/>
      <rect x="146" y="198" width="58" height="8" rx="2" fill="#4a2e18"/>
      <rect x="30" y="196" width="200" height="10" rx="2" fill="#4a2e18"/>
      <path d="M30 197h200" stroke="rgba(255,217,138,.28)" stroke-width="1.4"/>
      <rect x="112" y="176" width="28" height="20" rx="2" fill="#6b4426" stroke="#4a2e18" stroke-width="1.6"/>
      <path d="M112 184h28" stroke="#4a2e18" stroke-width="1.2" opacity=".8"/>
      <g transform="translate(114 168)">
        <ellipse cx="10" cy="5" rx="9" ry="4.5" fill="#d9e2ee" stroke="#9fb2c8" stroke-width="1.2"/>
        <path d="M18 5l6-3.5-1.5 3.5 1.5 3.5z" fill="#cdd8e6" stroke="#9fb2c8" stroke-width="1.2" stroke-linejoin="round"/>
        <circle cx="4.5" cy="4" r="1.1" fill="#3a2c18"/>
      </g>
    </svg>
    <div class="lantern l1"></div>
    <div class="lantern l2"></div>
  </div>

  <!-- 前景：鱼竿 -->
  <div class="rod" id="rod"><span class="rod-tip-ring" id="tipRing"></span></div>

  <!-- 漂浮粒子 -->
  <div class="fireflies" id="fireflies" aria-hidden="true"></div>

  <!-- 暗角聚焦 -->
  <div class="vignette" aria-hidden="true"></div>

  <!-- UI -->
  <header class="title">
    <h1>月光钓鱼小铺</h1>
    <p class="subtitle">夜风很轻 · 湖面正好</p>
  </header>

  <div class="hud">
    <span class="hud-chip">🪣 鱼篓 × <b id="count">0</b></span>
  </div>

  <div class="dock">
    <p class="hint" id="hint" aria-live="polite">点「抛竿」，把鱼线送进月光里</p>
    <button class="main-btn" id="mainBtn" data-state="idle" type="button">抛竿</button>
  </div>

  <!-- 收获卡片弹窗 -->
  <div class="modal" id="modal" hidden>
    <div class="modal-mask"></div>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="cardName">
      <div class="card-moon"><div class="card-icon" id="cardIcon"></div></div>
      <span class="rarity c" id="cardRarity">寻常</span>
      <h2 id="cardName">收获</h2>
      <p class="desc" id="cardDesc"></p>
      <p class="share" id="cardShare"></p>
      <div class="card-actions">
        <button class="btn primary" id="againBtn" type="button">再钓一次</button>
        <button class="btn ghost" id="copyBtn" type="button">复制收获文案</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status">已复制 ✨</div>
</div>
<script src="script.js"></script>
</body>
</html>
